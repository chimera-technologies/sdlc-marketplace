name: CI

# Fast, no-API checks on every change to the marketplace. Make "CI / test"
# a required status check on main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.13"]   # oldest supported and current
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests (validators, hooks, eval scoring)
        run: python -m unittest discover -s tests -v

      - name: Eval fixtures are consistent
        run: python evals/run_evals.py --skill write-intent --check-fixtures

      - name: Worked examples pass their own validators
        run: |
          python plugins/sdlc/skills/write-intent/scripts/validate_intent.py \
            --owners plugins/sdlc/skills/write-intent/examples/owners.yaml \
            plugins/sdlc/skills/write-intent/examples/*.md
          # The example spec is checked against the example intent it came from.
          d=$(mktemp -d); mkdir -p "$d/intent" "$d/specs"
          cp plugins/sdlc/skills/write-intent/examples/claims-status-self-service.md "$d/intent/"
          cp plugins/sdlc/skills/write-spec/examples/claims-status-self-service.md "$d/specs/"
          python plugins/sdlc/skills/write-spec/scripts/validate_spec.py \
            --owners plugins/sdlc/skills/write-intent/examples/owners.yaml \
            --root "$d" "$d/specs/claims-status-self-service.md"
          # The example plan is checked against the example spec's story S1.
          mkdir -p "$d/plans"
          cp plugins/sdlc/skills/build-story/examples/claims-status-self-service-s1.md "$d/plans/"
          python plugins/sdlc/skills/build-story/scripts/validate_plan.py \
            --root "$d" "$d/plans/claims-status-self-service-s1.md"
          # The example design (manifest + PNGs) is checked against the example spec.
          mkdir -p "$d/designs"
          cp -r plugins/sdlc/skills/design-ui/examples/claims-status-self-service "$d/designs/"
          python plugins/sdlc/skills/design-ui/scripts/validate_design.py \
            --owners plugins/sdlc/skills/write-intent/examples/owners.yaml \
            --root "$d" "$d/designs/claims-status-self-service/design.md"
          # The mockup example of the same design, re-rendered with the runner's Chrome.
          m=$(mktemp -d); mkdir -p "$m/specs" "$m/designs"
          cp plugins/sdlc/skills/write-spec/examples/claims-status-self-service.md "$m/specs/"
          cp -r plugins/sdlc/skills/design-ui/examples/mockup/claims-status-self-service "$m/designs/"
          rm -f "$m"/designs/claims-status-self-service/screens/*.png
          python plugins/sdlc/skills/design-ui/scripts/render_mockups.py "$m/designs/claims-status-self-service/design.md"
          python plugins/sdlc/skills/design-ui/scripts/validate_design.py \
            --owners plugins/sdlc/skills/write-intent/examples/owners.yaml \
            --root "$m" "$m/designs/claims-status-self-service/design.md"
          # The example release record.
          python plugins/sdlc/skills/release/scripts/validate_release.py \
            --owners plugins/sdlc/skills/write-intent/examples/owners.yaml \
            plugins/sdlc/skills/release/examples/v1.1.0.md

      - name: Plugin and marketplace versions match
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open(".claude-plugin/marketplace.json"))
          p = json.load(open("plugins/sdlc/.claude-plugin/plugin.json"))
          json.load(open("plugins/sdlc/hooks/hooks.json"))
          entry = next(x for x in m["plugins"] if x["name"] == p["name"])
          if entry["version"] != p["version"]:
              sys.exit(f"marketplace.json has {entry['version']}, plugin.json has {p['version']}")
          print(f"{p['name']} {p['version']}")
          EOF

      - name: Hook launcher parses
        run: bash -n plugins/sdlc/hooks/run-python.sh

  plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/sdlc

  workflows:
    # The reusable workflows and the setup-stack action are what every project runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows with actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml
      - name: Generated callers lint too
        run: |
          d=$(mktemp -d)
          printf '%s' '{"sdlc_ref":"v0.0.1","owners":{"product_owner":"@a","service_owner":"@b","tech_lead":"@c"},"jira":{"enabled":true,"site":"x.atlassian.net","space_key":"ABC"}}' > "$d/answers.json"
          python3 plugins/sdlc/skills/init/scripts/init_project.py --root "$d" --answers "$d/answers.json" >/dev/null
          ./actionlint -color "$d"/.github/workflows/*.yml
