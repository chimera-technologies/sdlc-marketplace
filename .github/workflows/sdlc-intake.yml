name: "SDLC Plan: intake"

# Reusable workflow of the sdlc plugin (workflow_call). Plan: turn a Jira ticket or a Maintain/Security/Tag signal into an intent PR (sdlc:write-intent).
# Projects call it from the .github/workflows/sdlc-*.yml files that
# /sdlc:init writes, pinned to the same tag as sdlc_ref.
#
# Single intake for the Plan stage in headless mode. Anything that can send a
# repository_dispatch can open an intent PR for its owner to triage:
#   - Jira Automation (ticket labelled / transitioned)   source=jira
#   - Maintain control-band breach (wave 4)             source=maintain
#   - Claude Security scheduled scan (wave 4)           source=claude-security
#   - Claude Tag in Slack (wave 4)                      source=claude-tag
#
# repository_dispatch payload:
#   { "event_type": "create-intent",
#     "client_payload": { "source": "jira", "record_id": "CLM-123" } }
#   non-Jira sources also send "fingerprint" (dedup key) and "signal" (object)
#
# The model never holds Jira or GitHub write credentials: this workflow
# fetches the ticket, Claude only reads a local JSON file and writes intent/,
# and a separate step opens the PR with a short-lived GitHub App token.

on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: "Tag of chimera-technologies/sdlc-marketplace to use for skills and scripts (same as the uses: @ref)"
        type: string
        required: true
      sdlc_repo:
        description: "The plugin marketplace repo"
        type: string
        default: chimera-technologies/sdlc-marketplace
      app_id:
        description: "GitHub App (sdlc-bot) ID: vars.SDLC_APP_ID"
        type: string
        required: true
      base_branch:
        description: "The protected branch artifacts merge into"
        type: string
        default: main
      jira_base_url:
        description: "vars.JIRA_BASE_URL, empty = no Jira"
        type: string
        default: ""
      jira_user_email:
        description: "vars.JIRA_USER_EMAIL"
        type: string
        default: ""
      model:
        description: "Claude model for this stage"
        type: string
        default: claude-sonnet-5
      source:
        description: "jira | maintain | claude-security | claude-tag"
        type: string
        required: true
      record_id:
        description: "Jira key, or none"
        type: string
        default: none
      fingerprint:
        description: "Dedup key for non-Jira sources"
        type: string
        default: ""
      signal:
        description: "Signal JSON for non-Jira sources"
        type: string
        default: "{}"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token (claude setup-token); or set ANTHROPIC_API_KEY"
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SDLC_APP_PRIVATE_KEY:
        description: "sdlc-bot GitHub App private key"
        required: true
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  SOURCE: ${{ inputs.source }}
  RECORD_ID: ${{ inputs.record_id || 'none' }}
  FINGERPRINT: ${{ inputs.fingerprint }}
  SIGNAL: ${{ inputs.signal || '{}' }}
  PLUGIN_DIR: .sdlc-plugin/plugins/sdlc
  VALIDATE: .sdlc-plugin/plugins/sdlc/skills/write-intent/scripts/validate_intent.py
  MODEL: ${{ inputs.model }}
  # Plugin PreToolUse hook: Claude may only write under these paths.
  SDLC_HEADLESS: "1"
  SDLC_WRITE_ALLOW: "intent/,.sdlc-output/duplicate.txt"
  JIRA_BASE_URL: ${{ inputs.jira_base_url }}
  JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}

jobs:
  create-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate trigger payload
        run: |
          set -euo pipefail
          case "$SOURCE" in jira|maintain|claude-security|claude-tag) ;;
            *) echo "::error::invalid source '$SOURCE'"; exit 1 ;; esac
          if [ "$RECORD_ID" != "none" ] && ! [[ "$RECORD_ID" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]]; then
            echo "::error::record_id must be a Jira key or 'none'"; exit 1; fi
          if [ "$SOURCE" = "jira" ] && [ "$RECORD_ID" = "none" ]; then
            echo "::error::source jira requires record_id"; exit 1; fi
          if [ -n "$FINGERPRINT" ] && ! [[ "$FINGERPRINT" =~ ^[a-z0-9-]{1,60}$ ]]; then
            echo "::error::fingerprint must match ^[a-z0-9-]{1,60}$"; exit 1; fi
          if [ "$RECORD_ID" != "none" ]; then KEY=$(echo "$RECORD_ID" | tr '[:upper:]' '[:lower:]')
          elif [ -n "$FINGERPRINT" ]; then KEY="$FINGERPRINT"
          else echo "::error::need record_id or fingerprint for dedup"; exit 1; fi
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          echo "BRANCH=intent/$KEY" >> "$GITHUB_ENV"

      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: Skip if this intent already exists
        id: dedup
        run: |
          set -euo pipefail
          existing=""
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            existing="open branch $BRANCH"
          elif [ "$RECORD_ID" != "none" ] && grep -rlx "record_id: $RECORD_ID" intent/ >/dev/null 2>&1; then
            existing=$(grep -rlx "record_id: $RECORD_ID" intent/ | head -n1)
          elif [ -n "$FINGERPRINT" ] && grep -rlx "fingerprint: $FINGERPRINT" intent/ >/dev/null 2>&1; then
            existing=$(grep -rlx "fingerprint: $FINGERPRINT" intent/ | head -n1)
          fi
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if [ -n "$existing" ]; then echo "::notice::Duplicate of $existing; not creating a new intent."; fi

      - name: Fetch source record
        if: steps.dedup.outputs.existing == ''
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .sdlc-input .sdlc-output
          if [ "$SOURCE" = "jira" ]; then
            curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" -H "Accept: application/json" \
              "$JIRA_BASE_URL/rest/api/2/issue/$RECORD_ID?fields=summary,description,reporter,components,priority,labels,issuetype,issuelinks" \
              -o .sdlc-input/record.json
          else
            printf '%s' "$SIGNAL" > .sdlc-input/record.json
          fi
          jq -e . .sdlc-input/record.json >/dev/null

      - uses: actions/setup-node@v4
        if: steps.dedup.outputs.existing == ''
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.dedup.outputs.existing == ''
        run: npm install -g @anthropic-ai/claude-code

      # Runs the Claude CLI directly, like intent-to-spec.yml: it works for
      # every trigger (repository_dispatch, workflow_dispatch). Claude holds
      # no GitHub or Jira token; Write/Edit are limited to SDLC_WRITE_ALLOW by
      # the plugin's headless write guard, and only the file named in
      # add-paths below is ever committed.
      - name: Draft intent with write-intent skill (headless)
        id: claude
        if: steps.dedup.outputs.existing == ''
        env:
          # POC: Claude subscription token from `claude setup-token`. For shared
          # or production use, set ANTHROPIC_API_KEY instead.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          transcript="$RUNNER_TEMP/intent-transcript.jsonl"
          echo "transcript=$transcript" >> "$GITHUB_OUTPUT"
          claude -p "/sdlc:write-intent mode=headless source=$SOURCE record_id=$RECORD_ID fingerprint=${FINGERPRINT:-none} input=.sdlc-input/record.json" \
            --plugin-dir "$PLUGIN_DIR" \
            --model "$MODEL" \
            --max-turns 30 \
            --strict-mcp-config \
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(python3 *validate_intent.py*)" \
            --output-format stream-json --verbose \
            > "$transcript"
          tail -n1 "$transcript" | jq -r '"turns: \(.num_turns)  cost: \(.total_cost_usd)  error: \(.is_error)"' || true

      - name: Collect result
        id: result
        if: steps.dedup.outputs.existing == ''
        run: |
          set -euo pipefail
          if [ -f .sdlc-output/duplicate.txt ]; then
            echo "::notice::Skill reported duplicate: $(cat .sdlc-output/duplicate.txt)"
            echo "existing=$(head -n1 .sdlc-output/duplicate.txt)" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mapfile -t files < <(git status --porcelain --untracked-files=all -- intent/ | awk '{print $2}' | grep '\.md$' || true)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one new intent file, got ${#files[@]}: ${files[*]:-none}"; exit 1; fi
          FILE="${files[0]}"
          if python3 "$VALIDATE" --owners .sdlc/owners.yaml "$FILE" 2> .sdlc-output/validation.txt; then
            valid=true; else valid=false; fi
          fm=$(python3 "$VALIDATE" --json "$FILE" 2>/dev/null || true)
          owner=$(jq -r '.owner // ""' <<<"$fm"); risk=$(jq -r '.risk // "high"' <<<"$fm")
          title=$(jq -r '.title // "untitled"' <<<"$fm")
          reviewers=""; team_reviewers=""
          if [[ "$owner" == @*/* ]]; then team_reviewers="${owner#*/}"; elif [[ "$owner" == @* ]]; then reviewers="${owner#@}"; fi
          summary=""
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            summary=$(jq -rs '[.[] | select(.type=="result")] | last | .result // ""' "$EXEC_FILE" 2>/dev/null || true)
          fi
          plugin_sha=$(git -C .sdlc-plugin rev-parse HEAD)
          {
            echo "Headless intent from **$SOURCE** \`$RECORD_ID\`. Merge to accept (starts Design); close with a reason to reject."
            echo
            [ "$valid" = "false" ] && { echo "> [!WARNING]"; echo "> Validation failed; opened as draft. Fix before merging:"; echo '```'; cat .sdlc-output/validation.txt; echo '```'; echo; }
            echo "### Summary"; echo "$summary"; echo
            echo "### Triage checklist ($owner)"
            echo "- [ ] Problem and outcome match the source record"
            echo "- [ ] Owner and risk (\`$risk\`) are right"
            echo "- [ ] Open questions are ones Design can answer, or answered here"
            echo "- [ ] Not a duplicate of an existing intent"
            echo
            echo "<details><summary>Evidence</summary>"
            echo
            echo "- Source: $SOURCE, record: $RECORD_ID, dedup key: $KEY"
            echo "- Skill: sdlc:write-intent @ \`${{ inputs.sdlc_repo }}@$plugin_sha\`"
            echo "- Model: $MODEL"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (transcript artifact)"
            echo "</details>"
          } > .sdlc-output/pr-body.md
          {
            echo "file=$FILE"; echo "valid=$valid"; echo "risk=$risk"; echo "title=$title"
            echo "reviewers=$reviewers"; echo "team_reviewers=$team_reviewers"
          } >> "$GITHUB_OUTPUT"
        env:
          EXEC_FILE: ${{ steps.claude.outputs.transcript }}

      - name: Upload session transcript (evidence)
        if: always() && steps.claude.outputs.transcript != ''
        uses: actions/upload-artifact@v4
        with:
          name: write-intent-transcript-${{ env.KEY }}
          path: ${{ steps.claude.outputs.transcript }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Open intent PR
        id: pr
        if: steps.result.outputs.file != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: ${{ env.BRANCH }}
          base: ${{ inputs.base_branch }}
          add-paths: ${{ steps.result.outputs.file }}
          commit-message: |
            intent: ${{ steps.result.outputs.title }}

            Source: ${{ env.SOURCE }}
            Record: ${{ env.RECORD_ID }}
          title: "intent: ${{ steps.result.outputs.title }}"
          body-path: .sdlc-output/pr-body.md
          draft: ${{ steps.result.outputs.valid == 'false' }}
          labels: |
            intent
            source:${{ env.SOURCE }}
            risk:${{ steps.result.outputs.risk }}
          reviewers: ${{ steps.result.outputs.reviewers }}
          team-reviewers: ${{ steps.result.outputs.team_reviewers }}

      - name: Link back to Jira (record holds the PR)
        if: env.SOURCE == 'jira' && (steps.pr.outputs.pull-request-url != '' || steps.dedup.outputs.existing != '' || steps.result.outputs.existing != '')
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          EXISTING: ${{ steps.dedup.outputs.existing || steps.result.outputs.existing }}
        run: |
          set -euo pipefail
          if [ -n "$PR_URL" ]; then msg="Intent drafted for owner review: $PR_URL"
          else msg="Intent already exists ($EXISTING); no new PR opened."; fi
          jq -n --arg b "$msg" '{body:$b}' | curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" -X POST --data @- \
            "$JIRA_BASE_URL/rest/api/2/issue/$RECORD_ID/comment" >/dev/null
          if [ -n "$PR_URL" ]; then
            jq -n --arg u "$PR_URL" '{object:{url:$u,title:"Intent PR"}}' | curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" -X POST --data @- \
              "$JIRA_BASE_URL/rest/api/2/issue/$RECORD_ID/remotelink" >/dev/null
          fi
