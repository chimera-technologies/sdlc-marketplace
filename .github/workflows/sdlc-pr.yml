name: "SDLC PR review and Test"

# Reusable workflow of the sdlc plugin (workflow_call). Story PRs: PR review (conformance gate + advisory reviewers), then Test (traceability + the project's tests).
# Projects call it from the .github/workflows/sdlc-*.yml files that
# /sdlc:init writes, pinned to the same tag as sdlc_ref.
#
# Every PR to main goes through two stages, in order:
#   1. PR review (story PRs, before Test)
#      review-gate -> sdlc:review-story: conformance with plan, spec, design
#                     screens, REVIEW.md, CLAUDE.md and the security policy.
#                     Fails on findings at or above .sdlc/review.json fail_on.
#      advisory    -> each reviewer in .sdlc/review.json "advisory" (default:
#                     Anthropic's code-review plugin); comments only, never blocks.
#   2. Test (only after the review gate passes, or for non-story PRs)
#      traceability -> the story's plan maps every acceptance criterion to a test
#      e2e          -> the project's static checks, then its full test suite
#   3. Story PRs whose tests fail: autofix goes back to Build (build-story
#      mode=fix-tests) on the same branch and pushes the fix to this PR, which
#      runs 1 and 2 again; at most autofix_attempts (2) times, then a person.
# Required checks on main: review-gate, traceability, e2e.

on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: "Tag of chimera-technologies/sdlc-marketplace to use for skills and scripts (same as the uses: @ref)"
        type: string
        required: true
      sdlc_repo:
        description: "The plugin marketplace repo"
        type: string
        default: chimera-technologies/sdlc-marketplace
      app_id:
        description: "GitHub App (sdlc-bot) ID: vars.SDLC_APP_ID"
        type: string
        required: true
      base_branch:
        description: "The protected branch artifacts merge into"
        type: string
        default: main
      jira_base_url:
        description: "vars.JIRA_BASE_URL, empty = no Jira"
        type: string
        default: ""
      jira_user_email:
        description: "vars.JIRA_USER_EMAIL"
        type: string
        default: ""
      fix_max_lines:
        description: "Fix lane: warn when a fix/ PR changes more lines than this (it should be a story)"
        type: number
        default: 300
      autofix_attempts:
        description: "Story PRs: automatic fixes of failing tests per PR before a person takes over (0 = off)"
        type: number
        default: 2
      fix_model:
        description: "Claude model for the automatic fix"
        type: string
        default: claude-opus-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token (claude setup-token); or set ANTHROPIC_API_KEY"
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SDLC_APP_PRIVATE_KEY:
        description: "sdlc-bot GitHub App private key"
        required: true
      JIRA_API_TOKEN:
        required: false
      XRAY_CLIENT_ID:
        description: "Xray API key client id (test cases and results in Jira); empty = no Xray"
        required: false
      XRAY_CLIENT_SECRET:
        description: "Xray API key client secret"
        required: false

permissions:
  contents: read

env:
  BASE_BRANCH: ${{ inputs.base_branch }}
  SDLC_PLUGIN_REPO: ${{ inputs.sdlc_repo }}
  SDLC_PLUGIN_REF: ${{ inputs.sdlc_ref }}
  PLUGIN_DIR: .sdlc-plugin/plugins/sdlc
  HEAD_REF: ${{ github.head_ref }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      story: ${{ steps.cfg.outputs.story }}
      gate: ${{ steps.cfg.outputs.gate }}
      advisory: ${{ steps.cfg.outputs.advisory }}
      fail_on: ${{ steps.cfg.outputs.fail_on }}
      model: ${{ steps.cfg.outputs.model }}
    steps:
      - uses: actions/checkout@v4
      - name: Read .sdlc/review.json
        id: cfg
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FIX_MAX: ${{ inputs.fix_max_lines }}
        run: |
          set -euo pipefail
          # story/ PRs: review gate, traceability, tests. fix/ PRs (the fix lane, no plan):
          # review gate and tests. Everything else: tests only.
          story=false; gate=false
          if [[ "$HEAD_REF" == story/* ]] && [ "$DRAFT" != "true" ]; then story=true; gate=true; fi
          if [[ "$HEAD_REF" == fix/* ]] && [ "$DRAFT" != "true" ]; then
            gate=true
            CHANGED_LINES=$(( ${ADDITIONS:-0} + ${DELETIONS:-0} ))
            if [ "$CHANGED_LINES" -gt "${FIX_MAX:-300}" ]; then
              echo "::warning title=Large fix::This fix changes $CHANGED_LINES lines (fix lane limit $FIX_MAX). Bigger changes go through a story: intent, spec, plan."
            fi
          fi
          advisory=$(jq -c --arg repo "$GITHUB_REPOSITORY" --arg pr "$PR" \
            '[.advisory[]? | .prompt |= (gsub("\\{repo\\}"; $repo) | gsub("\\{pr\\}"; $pr))]' .sdlc/review.json)
          {
            echo "story=$story"
            echo "gate=$gate"
            echo "fail_on=$(jq -r '.gate.fail_on // "high"' .sdlc/review.json)"
            echo "model=$(jq -r '.gate.model // "claude-sonnet-5"' .sdlc/review.json)"
            echo "advisory=$advisory"
          } >> "$GITHUB_OUTPUT"
          echo "Story PR: $story; advisory reviewers: $(jq -r 'map(.name) | join(", ")' <<<"$advisory")"

  review-gate:
    needs: config
    if: needs.config.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a review panel (several agents) can take over 10 minutes
    env:
      SDLC_HEADLESS: "1"
      SDLC_WRITE_ALLOW: ".sdlc-output/pr-review.json"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned sdlc plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDLC_PLUGIN_REPO }}
          ref: ${{ env.SDLC_PLUGIN_REF }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Findings the reviewer dismissed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          # /sdlc dismiss N <reason> comments: the review does not report those findings again.
          mkdir -p .sdlc-input
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/pr-comments.json"
          python3 "$PLUGIN_DIR/skills/review-story/scripts/findings.py" dismissed --comments "$RUNNER_TEMP/pr-comments.json" --out .sdlc-input/dismissed.md
          if [ -s .sdlc-input/dismissed.md ]; then echo "The reviewer dismissed earlier findings:"; cat .sdlc-input/dismissed.md; fi

      - name: AI budget check (review)
        id: budget-review
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: check
          stage: review
          token: ${{ steps.app.outputs.token }}

      - name: Conformance review (sdlc:review-story, headless)
        continue-on-error: true   # a crashed review becomes "failed" and the gate below blocks
        env:
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"   # wait for workflow agents to finish; the job timeout is the limit
          AI_BUDGET: ${{ steps.budget-review.outputs.flag }}
          MODEL: ${{ needs.config.outputs.model }}
        run: |
          set -euo pipefail
          mkdir -p .sdlc-output
          # Claude holds no GitHub or Jira token; it reads the repo and writes one JSON file.
          read -ra ai_budget <<<"${AI_BUDGET:-}"   # --max-budget-usd <n> from the budget check
          prompt="/sdlc:review-story mode=headless base=origin/$BASE_BRANCH"
          if [ -s .sdlc-input/dismissed.md ]; then prompt="$prompt dismissed=.sdlc-input/dismissed.md"; fi
          claude -p "$prompt" \
            "${ai_budget[@]}" \
            --plugin-dir "$PLUGIN_DIR" \
            --model "$MODEL" \
            --max-turns 40 \
            --strict-mcp-config \
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff*),Bash(git log*),Bash(git show*),Workflow,ToolSearch" \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/review-transcript.jsonl"
          tail -n1 "$RUNNER_TEMP/review-transcript.jsonl" | jq -r '"turns: \(.num_turns)  cost: \(.total_cost_usd)"' || true

      - name: Record AI spend (review)
        if: always() && steps.budget-review.outcome == 'success'
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: record
          stage: review
          transcript: ${{ runner.temp }}/review-transcript.jsonl
          token: ${{ steps.app.outputs.token }}

      - name: Render and post the review
        id: gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FAIL_ON: ${{ needs.config.outputs.fail_on }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # The step shell has -e: catch the gate's exit code so the comment is always updated.
          code=0
          python3 .sdlc-plugin/plugins/sdlc/skills/review-spec/scripts/render_review.py \
            .sdlc-output/pr-review.json --markdown "$RUNNER_TEMP/review.md" \
            --title "Conformance review" --fail-on "$FAIL_ON" > "$RUNNER_TEMP/verdict.txt" || code=$?
          verdict=$(cat "$RUNNER_TEMP/verdict.txt")
          # Each high or medium finding becomes its own comment the reviewer answers.
          python3 "$PLUGIN_DIR/skills/review-story/scripts/findings.py" comments .sdlc-output/pr-review.json --sha "$HEAD_SHA" \
            --out "$RUNNER_TEMP/findings.json" >/dev/null || echo '[]' > "$RUNNER_TEMP/findings.json"
          count=$(jq 'length' "$RUNNER_TEMP/findings.json")
          how=""
          if [ "$count" -gt 0 ]; then
            how=$'\n'"The $count high and medium finding(s) are posted below as separate comments. Reply \`/sdlc fix <n>\` (optionally with how) for the bot to fix one on this branch, or \`/sdlc dismiss <n> <reason>\` to accept it as it is."$'\n'
          fi
          body="<!-- sdlc-review-gate -->"$'\n'"$(cat "$RUNNER_TEMP/review.md")"$'\n'"$how""Gate: fails on \`$FAIL_ON\` or worse."
          # One sticky comment per PR, updated on every push.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq '[.[] | select(.body | startswith("<!-- sdlc-review-gate -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
          for l in review:clean review:concerns review:failed; do gh label create "$l" --force >/dev/null 2>&1 || true; done
          gh pr edit "$PR" --remove-label review:clean,review:concerns,review:failed >/dev/null 2>&1 || true
          gh pr edit "$PR" --add-label "review:$verdict" >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"
          # The previous review's finding comments are minimized as outdated, then this review's are posted.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- sdlc-finding ")) | .node_id' | while read -r node; do
            # shellcheck disable=SC2016  # $id is a GraphQL variable
            gh api graphql -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }' \
              -f id="$node" >/dev/null 2>&1 || true
          done
          for i in $(seq 0 $((count - 1))); do
            jq -r ".[$i].body" "$RUNNER_TEMP/findings.json" > "$RUNNER_TEMP/finding.md"
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/finding.md" >/dev/null \
              || echo "::warning::could not post finding $((i + 1)) as a comment"
          done
          if [ "$code" -ne 0 ]; then echo "::error::Review gate: findings at or above '$FAIL_ON' (or the review did not run). Answer each finding comment with /sdlc fix or /sdlc dismiss, or fix and push."; exit 1; fi

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/review-transcript.jsonl
            .sdlc-output/pr-review.json
          if-no-files-found: ignore
          retention-days: 30

  advisory:
    needs: config
    if: needs.config.outputs.gate == 'true' && needs.config.outputs.advisory != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true   # advisory reviewers never block
    strategy:
      fail-fast: false
      matrix:
        reviewer: ${{ fromJSON(needs.config.outputs.advisory) }}
    name: advisory (${{ matrix.reviewer.name }})
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: AI budget check (advisory)
        id: budget-advisory
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: check
          stage: advisory
          token: ${{ steps.app.outputs.token }}

      - uses: anthropics/claude-code-action@v1
        id: advisory
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # sdlc-bot App token: comments post as the bot, and no OIDC exchange is needed.
          github_token: ${{ steps.app.outputs.token }}
          # Automatic Build opens story PRs as sdlc-bot; allow that bot, and only that one.
          allowed_bots: ${{ steps.app.outputs.app-slug }}
          plugin_marketplaces: ${{ matrix.reviewer.marketplace || '' }}
          plugins: ${{ matrix.reviewer.plugin || '' }}
          prompt: ${{ matrix.reviewer.prompt }}
          claude_args: >-
            --max-turns 40
            ${{ steps.budget-advisory.outputs.flag }}
            ${{ matrix.reviewer.allowed_tools && format('--allowedTools "{0}"', matrix.reviewer.allowed_tools) || '' }}

      - name: Record AI spend (advisory)
        if: always() && steps.budget-advisory.outcome == 'success'
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: record
          stage: advisory
          transcript: ${{ steps.advisory.outputs.execution_file }}
          token: ${{ steps.app.outputs.token }}

  traceability:
    needs: [config, review-gate]
    if: always() && needs.config.outputs.story == 'true' && needs.review-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token (plugin read)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4

      - name: Check out pinned sdlc plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDLC_PLUGIN_REPO }}
          ref: ${{ env.SDLC_PLUGIN_REF }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: Validate plan and acceptance-test traceability
        run: |
          set -euo pipefail
          # The plan names its branch (story/<jira-key>-<name>, or story/<spec-slug>-s<n> without Jira).
          plan=$(grep -lx "branch: $HEAD_REF" plans/*.md 2>/dev/null | head -n1 || true)
          if [ -z "$plan" ] && [[ "$HEAD_REF" =~ ^story/([a-z][a-z0-9]*-[0-9]+)(-|$) ]]; then
            key=$(tr '[:lower:]' '[:upper:]' <<<"${BASH_REMATCH[1]}")   # older plans: by Jira key
            plan=$(grep -lx "jira: $key" plans/*.md 2>/dev/null | head -n1 || true)
          fi
          [ -n "$plan" ] || { echo "::error::no plan in plans/ for branch $HEAD_REF; build stories with /sdlc:build-story"; exit 1; }
          echo "Branch $HEAD_REF, plan $plan"
          python3 "$PLUGIN_DIR/skills/build-story/scripts/validate_plan.py" --check-tests "$plan"

  e2e:
    needs: [config, review-gate]
    # Story PRs: only after the review gate passes. Other PRs (design, spec, config): always.
    if: always() && (needs.review-gate.result == 'success' || (needs.config.outputs.gate != 'true' && needs.config.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_BASE_URL: ${{ vars.XRAY_BASE_URL }}   # empty = Xray's global cloud
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history for check_command {files}

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: Set up the project's stack (.sdlc/build.yaml)
        id: stack
        uses: ./.sdlc-plugin/.github/actions/setup-stack
        with:
          # Story PRs need a stack; intent, spec, design and stack PRs can
          # come before the spec decided one or the first story scaffolded it.
          require-tests: ${{ needs.config.outputs.gate == 'true' && 'true' || 'false' }}
          skip-without-code: ${{ needs.config.outputs.gate == 'true' && 'false' || 'true' }}

      - name: Nothing to test yet
        if: steps.stack.outputs.test_command == ''
        run: echo "::notice::Tests skipped. No test_command in .sdlc/build.yaml yet, or none of its code_paths exist (the first story creates them)."

      - name: Move the Jira story to In QA
        if: needs.config.outputs.story == 'true' && inputs.jira_base_url != ''
        continue-on-error: true   # Jira never blocks the PR
        env:
          JIRA_BASE_URL: ${{ inputs.jira_base_url }}
          JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          plan=$(grep -lx "branch: $HEAD_REF" plans/*.md 2>/dev/null | head -n1 || true)
          key=$([ -n "$plan" ] && sed -n 's/^jira:[[:space:]]*\([A-Z][A-Z0-9]*-[0-9]*\)[[:space:]]*$/\1/p' "$plan" | head -n1 || true)
          [ -n "$key" ] || { echo "No Jira story for $HEAD_REF; skipping."; exit 0; }
          python3 "$PLUGIN_DIR/skills/build-story/scripts/jira_story.py" "$key" move in-qa

      - name: Run the project's static checks (check_command)
        if: steps.stack.outputs.check_command != '' && steps.stack.outputs.test_command != ''
        env:
          CMD: ${{ steps.stack.outputs.check_command }}
          RANGE: origin/${{ inputs.base_branch }}...HEAD
        run: |
          set -euo pipefail
          # {files}: only the code files this change touched, so old problems elsewhere do not block it.
          if [[ "$CMD" == *"{files}"* ]]; then
            files=$(python3 .sdlc-plugin/.github/actions/setup-stack/stack.py --changed "$RANGE")
            if [ -z "$files" ]; then echo "No changed code files: static checks skipped."; exit 0; fi
            CMD=${CMD//\{files\}/$files}
          fi
          bash -euo pipefail -c "$CMD"

      - name: Run the project's tests (test_command)
        if: steps.stack.outputs.test_command != ''
        env:
          CMD: ${{ steps.stack.outputs.test_command }}
        run: bash -euo pipefail -c "$CMD"

      - name: Record the results in Xray
        # Story PRs, when Xray is set up and the tests write JUnit results (results_path).
        if: >-
          always() && needs.config.outputs.story == 'true' && env.XRAY_CLIENT_ID != ''
          && steps.stack.outputs.results_path != '' && steps.stack.outputs.test_command != ''
        continue-on-error: true   # Xray never blocks the PR
        env:
          JIRA_BASE_URL: ${{ inputs.jira_base_url }}
          JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          RESULTS: ${{ steps.stack.outputs.results_path }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          plan=$(grep -lx "branch: $HEAD_REF" plans/*.md 2>/dev/null | head -n1 || true)
          if [ -z "$plan" ]; then echo "No plan for $HEAD_REF; nothing to record."; exit 0; fi
          python3 "$PLUGIN_DIR/skills/build-story/scripts/xray_sync.py" results --plan "$plan" \
            --junit "$RESULTS" --label "PR #$PR" --revision "$SHA" --run-url "$RUN_URL"

      - name: Upload test report
        if: always() && steps.stack.outputs.report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}-${{ github.job }}
          path: ${{ steps.stack.outputs.report_path }}
          if-no-files-found: ignore
          retention-days: 30

  jira:
    needs: [config, review-gate, traceability, e2e]
    # Story PRs: the Jira story goes to In Review when the review gate, traceability and the
    # tests pass, and back to In Progress when one of them fails (autofix or a person fixes it).
    if: always() && needs.config.outputs.story == 'true' && inputs.jira_base_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true   # Jira never blocks the PR
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token (plugin read)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4

      - name: Check out pinned sdlc plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SDLC_PLUGIN_REPO }}
          ref: ${{ env.SDLC_PLUGIN_REF }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: Move the Jira story (In Review, or back to In Progress)
        env:
          JIRA_BASE_URL: ${{ inputs.jira_base_url }}
          JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GATE: ${{ needs.review-gate.result }}
          TRACE: ${{ needs.traceability.result }}
          E2E: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          plan=$(grep -lx "branch: $HEAD_REF" plans/*.md 2>/dev/null | head -n1 || true)
          key=$([ -n "$plan" ] && sed -n 's/^jira:[[:space:]]*\([A-Z][A-Z0-9]*-[0-9]*\)[[:space:]]*$/\1/p' "$plan" | head -n1 || true)
          [ -n "$key" ] || { echo "No Jira story for $HEAD_REF; skipping."; exit 0; }
          JS="$PLUGIN_DIR/skills/build-story/scripts/jira_story.py"
          echo "review gate: $GATE, traceability: $TRACE, tests: $E2E"
          if [ "$GATE" = success ] && [ "$TRACE" = success ] && [ "$E2E" = success ]; then
            python3 "$JS" "$key" move in-review
          elif [ "$GATE" = failure ] || [ "$TRACE" = failure ] || [ "$E2E" = failure ]; then
            failed=()
            [ "$GATE" = failure ] && failed+=("review gate")
            [ "$TRACE" = failure ] && failed+=("traceability")
            [ "$E2E" = failure ] && failed+=("tests")
            python3 "$JS" "$key" move in-progress --back
            python3 "$JS" "$key" comment "PR #$PR: $(IFS=,; echo "${failed[*]}" | sed 's/,/, /g') failed, so the story is back In Progress until it is fixed. Run: $RUN_URL"
          else
            echo "Checks were cancelled or skipped; status unchanged."
          fi

  autofix:
    needs: [config, traceability, e2e]
    # Story PRs whose tests (or traceability) failed go back to Build on the same branch:
    # build-story mode=fix-tests fixes the code and pushes to this PR, which re-runs the
    # review gate and the tests. At most autofix_attempts times per PR, then a person.
    if: >-
      always() && needs.config.outputs.story == 'true' && inputs.autofix_attempts > 0
      && (needs.e2e.result == 'failure' || needs.traceability.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: autofix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      SDLC_HEADLESS: "1"
      # Code may go anywhere the stack needs it; the SDLC's own files may not change.
      SDLC_WRITE_ALLOW: "*"
      SDLC_WRITE_DENY: ".github/,.sdlc/,.claude/,intent/,specs/,designs/,plans/,releases/,runbooks/,CLAUDE.md,REVIEW.md,.sdlc-plugin/"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SCRIPTS: .sdlc-plugin/plugins/sdlc/skills/build-story/scripts
      MODEL: ${{ inputs.fix_model }}
      MAX_ATTEMPTS: ${{ inputs.autofix_attempts }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Attempts so far, and the story's plan
        id: go
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          attempts=$(git log "origin/$BASE_BRANCH..HEAD" --format=%s | grep -c '^autofix:' || true)
          plan=$(grep -lx "branch: $HEAD_REF" plans/*.md 2>/dev/null | head -n1 || true)
          go=true
          if [ -z "$plan" ]; then
            echo "::notice::No plan in plans/ for $HEAD_REF: nothing to fix against."; go=false
          elif [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
            go=false
            marker="<!-- sdlc-autofix-stopped -->"
            if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
              printf '%s\n%s\n' "$marker" "The tests still fail after $attempts automatic fix attempts, so the bot has stopped. A person needs to look: open the failed check, fix the code on this branch (\`/sdlc:build-story\` on \`$HEAD_REF\`, or by hand), and push." > "$RUNNER_TEMP/stop.md"
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/stop.md" >/dev/null || true
            fi
            echo "::warning::Auto-fix stopped after $attempts attempts (autofix_attempts $MAX_ATTEMPTS)."
          fi
          { echo "go=$go"; echo "plan=$plan"; echo "attempt=$((attempts + 1))"; } >> "$GITHUB_OUTPUT"

      - name: Check out the sdlc plugin (pinned)
        if: steps.go.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin
          persist-credentials: false

      - name: Read the Ponytail pin
        id: pins
        if: steps.go.outputs.go == 'true'
        run: |
          ref=$(sed -n 's/^ponytail_ref:[[:space:]]*\([^[:space:]#]*\).*/\1/p' .sdlc/build.yaml | head -n1)
          echo "ponytail_ref=${ref:-v4.10.0}" >> "$GITHUB_OUTPUT"

      - name: Check out Ponytail (pinned)
        if: steps.go.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: DietrichGebert/ponytail
          ref: ${{ steps.pins.outputs.ponytail_ref }}
          path: .sdlc-ponytail
          persist-credentials: false

      - name: Move Ponytail out of the project
        if: steps.go.outputs.go == 'true'
        run: mv .sdlc-ponytail "$RUNNER_TEMP/ponytail"

      - uses: actions/setup-node@v4
        if: steps.go.outputs.go == 'true'
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.go.outputs.go == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Set up the project's stack (.sdlc/build.yaml)
        id: stack
        if: steps.go.outputs.go == 'true'
        uses: ./.sdlc-plugin/.github/actions/setup-stack
        with:
          require-tests: "true"

      - name: Reproduce the failure
        id: repro
        if: steps.go.outputs.go == 'true'
        env:
          PLAN: ${{ steps.go.outputs.plan }}
          CHECK: ${{ steps.stack.outputs.check_command }}
          TESTS: ${{ steps.stack.outputs.test_command }}
        run: |
          set -uo pipefail
          # Run the failing checks here and keep their output: the fix starts from what really fails.
          mkdir -p .sdlc-input
          log=.sdlc-input/failure.log; failed=false
          {
            echo "== traceability: validate_plan.py --check-tests $PLAN"
            python3 "$SCRIPTS/validate_plan.py" --check-tests "$PLAN" 2>&1 || failed=true
            if [ -n "$CHECK" ] && [[ "$CHECK" != *"{files}"* ]]; then
              echo "== check_command: $CHECK"
              bash -o pipefail -c "$CHECK" 2>&1 || failed=true
            fi
            echo "== test_command: $TESTS"
            bash -o pipefail -c "$TESTS" 2>&1 || failed=true
          } > "$RUNNER_TEMP/full.log"
          # Keep it short for the model: the end of each run holds the failures and the summary.
          tail -n 400 "$RUNNER_TEMP/full.log" | sed 's/\x1b\[[0-9;]*m//g' > "$log"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Reproduced: $failed"

      - name: Say the failure did not happen again
        if: steps.go.outputs.go == 'true' && steps.repro.outputs.failed != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          body="The failed checks pass when run again here, so this looks like a flaky test, not a code problem: nothing was changed. Re-run the failed jobs. If a test fails now and then, fix the test through the fix lane (\`/sdlc:fix\`)."
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null || echo "::warning::could not comment on #$PR"

      - name: Preflight (Graphify, Ponytail)
        if: steps.repro.outputs.failed == 'true'
        run: |
          # Exit 3 only means Ponytail is not active yet; it loads with the Claude session below.
          python3 "$SCRIPTS/build_preflight.py" || [ $? -eq 3 ]

      - name: AI budget check (autofix)
        id: budget-autofix
        if: steps.repro.outputs.failed == 'true'
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: check
          stage: autofix
          token: ${{ steps.app.outputs.token }}

      - name: Fix the failing tests with build-story (headless)
        if: steps.repro.outputs.failed == 'true'
        continue-on-error: true   # the report says what is left; the step after it replies
        env:
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"   # wait for workflow agents to finish; the job timeout is the limit
          AI_BUDGET: ${{ steps.budget-autofix.outputs.flag }}
          PLAN: ${{ steps.go.outputs.plan }}
        run: |
          set -euo pipefail
          mkdir -p .sdlc-output
          read -ra ai_budget <<<"${AI_BUDGET:-}"   # --max-budget-usd <n> from the budget check
          claude -p "/sdlc:build-story mode=fix-tests plan=$PLAN failure=.sdlc-input/failure.log" \
            "${ai_budget[@]}" \
            --plugin-dir "$PLUGIN_DIR" \
            --plugin-dir "$RUNNER_TEMP/ponytail" \
            --model "$MODEL" \
            --max-turns 150 \
            --strict-mcp-config \
            --allowedTools "Read,Glob,Grep,Write,Edit,MultiEdit,Bash,Task,Agent" \
            --disallowedTools "Bash(git push*),Bash(gh *),Bash(curl *),Bash(wget *),Bash(terraform apply*),Bash(terraform destroy*),Bash(kubectl apply*),Bash(kubectl delete*),Bash(helm install*),Bash(helm upgrade*),Bash(helm uninstall*)" \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/autofix-transcript.jsonl"
          tail -n1 "$RUNNER_TEMP/autofix-transcript.jsonl" | jq -r '"turns: \(.num_turns)  cost: \(.total_cost_usd)  error: \(.is_error)"' || true

      - name: Record AI spend (autofix)
        if: always() && steps.budget-autofix.outcome == 'success'
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: record
          stage: autofix
          transcript: ${{ runner.temp }}/autofix-transcript.jsonl
          token: ${{ steps.app.outputs.token }}

      - name: Push the fix to this PR and reply
        if: always() && steps.repro.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          ATTEMPT: ${{ steps.go.outputs.attempt }}
        run: |
          set -uo pipefail
          reply() {
            local out
            out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$1" 2>&1) \
              || echo "::warning title=Reply failed::Could not reply on #$PR: ${out:0:300}"
          }
          # The fix may not change the SDLC's own files: put them back.
          protected=(.github .sdlc .claude intent specs designs plans releases runbooks CLAUDE.md REVIEW.md)
          git ls-files -z -m -d -- "${protected[@]}" | xargs -0 -r git checkout HEAD --
          git clean -fdq -- "${protected[@]}"
          printf '%s\n' node_modules/ .venv/ venv/ __pycache__/ .pytest_cache/ target/ bin/ obj/ dist/ build/ \
            coverage/ test-results/ playwright-report/ graphify-out/ .sdlc-output/ .sdlc-input/ .sdlc-plugin/ >> .git/info/exclude
          report="$RUNNER_TEMP/report.md"
          if [ -f .sdlc-output/fix-report.md ]; then cp .sdlc-output/fix-report.md "$report"; else echo "RESULT: NOT FIXED (no report was written; see the run)" > "$report"; fi
          git add -A
          if git diff --cached --quiet; then
            { echo "Auto-fix attempt $ATTEMPT of $MAX_ATTEMPTS changed nothing:"; echo; cat "$report"; } > "$RUNNER_TEMP/reply.md"
            reply "$RUNNER_TEMP/reply.md"
            exit 0
          fi
          uid=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${uid}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -q -m "autofix: make the failing checks pass (attempt $ATTEMPT of $MAX_ATTEMPTS)" \
                      -m "$(head -n 20 "$report")"
          if ! git push -q origin "HEAD:$HEAD_REF"; then
            echo "::error::could not push the fix to $HEAD_REF (the branch may have moved)."
            exit 1
          fi
          sha=$(git rev-parse --short HEAD)
          echo "Pushed $sha to $HEAD_REF."
          {
            echo "Auto-fix attempt $ATTEMPT of $MAX_ATTEMPTS pushed \`$sha\`: the review gate and the tests run again on it."
            echo
            cat "$report"
            echo
            echo '~~~'; git show --stat --format= HEAD; echo '~~~'
          } > "$RUNNER_TEMP/reply.md"
          reply "$RUNNER_TEMP/reply.md"
