name: "SDLC Deploy - release"

# Reusable workflow of the sdlc plugin (workflow_call). Deploy stage: when a
# release record (releases/<version>.md, written by /sdlc:release) merges,
#   detect          -> validate the record; read .sdlc/deploy.yaml
#   tag             -> create the tag and GitHub release at the record's commit
#   staging         -> (environment: staging) cloud login (OIDC); IaC plan and
#                      apply; deploy_command; smoke_command
#   production-plan -> (environment: production-plan, no reviewers, read-only
#                      identity) the production IaC plan, shown in the run
#                      summary for the approvers and saved as an artifact
#   production      -> (environment: production, waits for its required
#                      reviewers) applies exactly that saved plan;
#                      deploy_command; smoke_command
#   jira            -> comment "Released in <version>" on each story in the record
# The cloud (aws, azure, gcp) and IaC tool (terraform) are the architect's
# choice in the spec, recorded in .sdlc/deploy.yaml; each environment's cloud
# identity is in that GitHub environment's variables. A plan that destroys or
# replaces anything stops the release until a person re-runs it with
# allow_destroy. A failed smoke test on staging means production never runs.
# No model involved; nothing reaches production without a human approval.
# With nothing to deploy, a release is the tag + GitHub release + record only.

on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: "Tag of the plugin marketplace (same as the uses: @ref)"
        type: string
        required: true
      sdlc_repo:
        type: string
        default: chimera-technologies/sdlc-marketplace
      app_id:
        type: string
        required: true
      base_branch:
        type: string
        default: main
      jira_base_url:
        type: string
        default: ""
      jira_user_email:
        type: string
        default: ""
      release_file:
        description: "Re-run for one merged record (releases/<version>.md); empty = records added in this push"
        type: string
        default: ""
      allow_destroy:
        description: "Apply an infrastructure plan that destroys or replaces resources (after reading it)"
        type: boolean
        default: false
      staging_on_merge:
        description: "Trunk-based: deploy every merge to the base branch to staging (no tag, never production)"
        type: boolean
        default: false
      trunk_green:
        description: "The tests of this push passed on the base branch. When false, only a rollback is released"
        type: boolean
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SDLC_APP_PRIVATE_KEY:
        required: true
      JIRA_API_TOKEN:
        required: false
      DEPLOY_TOKEN:
        description: "Passed to deploy_command; an environment secret of the same name overrides it"
        required: false

permissions:
  contents: read
  id-token: write   # OIDC cloud login; the caller grants it to this job

env:
  VALIDATE_RELEASE: .sdlc-plugin/plugins/sdlc/skills/release/scripts/validate_release.py
  DEPLOY_CONFIG: .sdlc-plugin/plugins/sdlc/skills/release/scripts/deploy_config.py
  IAC: .sdlc-plugin/plugins/sdlc/skills/release/scripts/iac.py

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      file: ${{ steps.find.outputs.file }}
      version: ${{ steps.find.outputs.version }}
      commit: ${{ steps.find.outputs.commit }}
      mode: ${{ steps.find.outputs.mode }}
      label: ${{ steps.find.outputs.label }}
      jira_keys: ${{ steps.find.outputs.jira_keys }}
      deploys: ${{ steps.cfg.outputs.deploys }}
      deploy_command: ${{ steps.cfg.outputs.deploy_command }}
      smoke_command: ${{ steps.cfg.outputs.smoke_command }}
      cloud: ${{ steps.cfg.outputs.cloud }}
      iac: ${{ steps.cfg.outputs.iac }}
      staging_environment: ${{ steps.cfg.outputs.staging_environment }}
      production_environment: ${{ steps.cfg.outputs.production_environment }}
      production_plan_environment: ${{ steps.cfg.outputs.production_plan_environment }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: Find and validate the release record
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_FILE: ${{ inputs.release_file }}
          STAGING_ON_MERGE: ${{ inputs.staging_on_merge }}
          TRUNK_GREEN: ${{ inputs.trunk_green }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_FILE" ]; then
            [[ "$MANUAL_FILE" =~ ^releases/v[0-9]+\.[0-9]+\.[0-9]+\.md$ ]] || { echo "::error::release_file must look like releases/vX.Y.Z.md"; exit 1; }
            files=("$MANUAL_FILE")
          else
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE="$AFTER^"
            fi
            mapfile -t files < <(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'releases/v*.md')
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            if [ "$STAGING_ON_MERGE" = "true" ] && [ -z "$MANUAL_FILE" ] && [ "$TRUNK_GREEN" != "true" ]; then
              echo "::warning::${{ inputs.base_branch }} is red: not deploying it to staging until the tests pass."
            elif [ "$STAGING_ON_MERGE" = "true" ] && [ -z "$MANUAL_FILE" ]; then
              # Trunk-based: this merge goes to staging as it is; production still needs a release.
              short=$(git rev-parse --short "$AFTER")
              { echo "mode=continuous"; echo "commit=$AFTER"; echo "label=${{ inputs.base_branch }}@$short"; } >> "$GITHUB_OUTPUT"
              echo "No new release record: deploying ${{ inputs.base_branch }}@$short to staging."
            else
              echo "No new release record; nothing to release."
            fi
            exit 0
          fi
          if [ "${#files[@]}" -gt 1 ]; then echo "::error::one release record per merge, got ${files[*]}"; exit 1; fi
          f="${files[0]}"
          python3 "$VALIDATE_RELEASE" --owners .sdlc/owners.yaml "$f"
          python3 "$VALIDATE_RELEASE" --json "$f" > "$RUNNER_TEMP/release.json"
          commit=$(jq -r .commit "$RUNNER_TEMP/release.json")
          # Trunk-based: never release a red trunk. A rollback goes out anyway: it is how a bad release is undone.
          if [ "$TRUNK_GREEN" != "true" ] && [ "$(jq -r .type "$RUNNER_TEMP/release.json")" != "rollback" ]; then
            echo "::error::${{ inputs.base_branch }} is red (see the open main-red issue): fix it before releasing, or release a rollback."
            exit 1
          fi
          git merge-base --is-ancestor "$commit" "origin/${{ inputs.base_branch }}" \
            || { echo "::error::commit $commit is not on ${{ inputs.base_branch }}"; exit 1; }
          version=$(jq -r .version "$RUNNER_TEMP/release.json")
          {
            echo "mode=release"
            echo "label=$version"
            echo "file=$f"
            echo "version=$version"
            echo "commit=$commit"
            echo "jira_keys=$(jq -r '.jira_keys | join(" ")' "$RUNNER_TEMP/release.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Read .sdlc/deploy.yaml
        id: cfg
        run: python3 "$DEPLOY_CONFIG"

  tag:
    needs: detect
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          COMMIT: ${{ needs.detect.outputs.commit }}
          FILE: ${{ needs.detect.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "::notice::$VERSION already released"; exit 0; fi
          # Notes = the record without its frontmatter.
          awk 'BEGIN{n=0} /^---$/{n++; next} n>=2' "$FILE" > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --target "$COMMIT" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  staging:
    needs: [detect, tag]
    # A release (after its tag), or, trunk-based, every merge to the base branch (no tag).
    if: >-
      always() && needs.detect.result == 'success' && needs.detect.outputs.deploys == 'true'
      && needs.detect.outputs.staging_environment != ''
      && (needs.tag.result == 'success' || (needs.detect.outputs.mode == 'continuous' && needs.tag.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.detect.outputs.staging_environment }}
    # One deploy to staging at a time, in merge order.
    concurrency:
      group: ${{ github.repository }}-staging
      cancel-in-progress: false
    env:
      SDLC_ENV: staging
      SDLC_VERSION: ${{ needs.detect.outputs.label }}
      SDLC_COMMIT: ${{ needs.detect.outputs.commit }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.commit }}
          persist-credentials: false

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin
          persist-credentials: false

      - name: Set up the project's stack
        uses: ./.sdlc-plugin/.github/actions/setup-stack

      - name: Log in to the cloud (OIDC)
        if: needs.detect.outputs.cloud != 'none'
        uses: ./.sdlc-plugin/.github/actions/cloud-login
        with:
          cloud: ${{ needs.detect.outputs.cloud }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Plan the infrastructure (stops on destroy or replace)
        if: needs.detect.outputs.iac != 'none'
        env:
          ALLOW: ${{ inputs.allow_destroy && '--allow-destroy' || '' }}
        run: |
          # shellcheck disable=SC2086
          python3 "$IAC" plan --env staging --out "$RUNNER_TEMP/staging.tfplan" --summary "$RUNNER_TEMP/staging-plan.md" $ALLOW

      - name: Apply the infrastructure
        if: needs.detect.outputs.iac != 'none'
        run: python3 "$IAC" apply --env staging --plan "$RUNNER_TEMP/staging.tfplan"

      - name: Deploy to staging
        if: needs.detect.outputs.deploy_command != ''
        env:
          CMD: ${{ needs.detect.outputs.deploy_command }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: bash -euo pipefail -c "$CMD"

      - name: Smoke test staging (production waits for this)
        if: needs.detect.outputs.smoke_command != ''
        env:
          CMD: ${{ needs.detect.outputs.smoke_command }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: bash -euo pipefail -c "$CMD"

  production-plan:
    needs: [detect, tag, staging]
    if: always() && needs.tag.result == 'success' && needs.detect.outputs.iac != 'none' && needs.detect.outputs.production_environment != '' && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No reviewers on this environment; give its identity read-only (plan) rights.
    environment: ${{ needs.detect.outputs.production_plan_environment }}
    env:
      SDLC_ENV: production
      SDLC_VERSION: ${{ needs.detect.outputs.version }}
      SDLC_COMMIT: ${{ needs.detect.outputs.commit }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.commit }}
          persist-credentials: false

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin
          persist-credentials: false

      - name: Set up the project's stack
        uses: ./.sdlc-plugin/.github/actions/setup-stack

      - name: Log in to the cloud (OIDC, plan identity)
        if: needs.detect.outputs.cloud != 'none'
        uses: ./.sdlc-plugin/.github/actions/cloud-login
        with:
          cloud: ${{ needs.detect.outputs.cloud }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Plan production (shown to the approvers; stops on destroy or replace)
        env:
          ALLOW: ${{ inputs.allow_destroy && '--allow-destroy' || '' }}
        run: |
          # shellcheck disable=SC2086
          python3 "$IAC" plan --env production --out "$RUNNER_TEMP/production.tfplan" --summary "$RUNNER_TEMP/production-plan.md" $ALLOW

      - name: Save the plan for the production job
        uses: actions/upload-artifact@v4
        with:
          name: production-tfplan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/production.tfplan
            ${{ runner.temp }}/production-plan.md
          retention-days: 3

  production:
    needs: [detect, tag, staging, production-plan]
    # After staging (or with no staging) and the production plan (or no IaC),
    # and only once the environment's reviewers approve.
    if: always() && needs.tag.result == 'success' && needs.detect.outputs.deploys == 'true' && needs.detect.outputs.production_environment != '' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') && (needs.production-plan.result == 'success' || needs.production-plan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.detect.outputs.production_environment }}
    env:
      SDLC_ENV: production
      SDLC_VERSION: ${{ needs.detect.outputs.version }}
      SDLC_COMMIT: ${{ needs.detect.outputs.commit }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.commit }}
          persist-credentials: false

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin
          persist-credentials: false

      - name: Set up the project's stack
        uses: ./.sdlc-plugin/.github/actions/setup-stack

      - name: Log in to the cloud (OIDC)
        if: needs.detect.outputs.cloud != 'none'
        uses: ./.sdlc-plugin/.github/actions/cloud-login
        with:
          cloud: ${{ needs.detect.outputs.cloud }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Get the approved production plan
        if: needs.detect.outputs.iac != 'none'
        uses: actions/download-artifact@v4
        with:
          name: production-tfplan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan

      - name: Apply exactly the approved plan
        if: needs.detect.outputs.iac != 'none'
        run: |
          cat "$RUNNER_TEMP/plan/production-plan.md" >> "$GITHUB_STEP_SUMMARY"
          python3 "$IAC" apply --env production --plan "$RUNNER_TEMP/plan/production.tfplan"

      - name: Deploy to production
        if: needs.detect.outputs.deploy_command != ''
        env:
          CMD: ${{ needs.detect.outputs.deploy_command }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: bash -euo pipefail -c "$CMD"

      - name: Smoke test production
        if: needs.detect.outputs.smoke_command != ''
        env:
          CMD: ${{ needs.detect.outputs.smoke_command }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: bash -euo pipefail -c "$CMD"

  jira:
    needs: [detect, tag, production]
    if: always() && needs.tag.result == 'success' && needs.detect.outputs.jira_keys != '' && inputs.jira_base_url != '' && needs.production.result != 'failure' && needs.production.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment the release on each story
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ inputs.jira_base_url }}
          JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}
          KEYS: ${{ needs.detect.outputs.jira_keys }}
          VERSION: ${{ needs.detect.outputs.version }}
          WHERE: ${{ needs.production.result == 'success' && 'production' || 'tagged (no production deploy)' }}
        run: |
          set -euo pipefail
          if [ -z "$JIRA_API_TOKEN" ]; then echo "::notice::Jira not configured; skipping."; exit 0; fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          for key in $KEYS; do
            jq -n --arg b "Released in $VERSION ($WHERE): $url" '{body:$b}' | curl -fsS -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
              -H "Content-Type: application/json" -X POST --data @- "$JIRA_BASE_URL/rest/api/2/issue/$key/comment" >/dev/null
            echo "Commented on $key"
          done
