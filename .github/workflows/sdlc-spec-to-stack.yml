name: "SDLC Design: spec to stack"

# Reusable workflow of the sdlc plugin (workflow_call). Design -> Build: turn a merged spec's stack and cloud decision into .sdlc/build.yaml and .sdlc/deploy.yaml, as a PR for the tech lead.
# Projects call it from the .github/workflows/sdlc-*.yml files that
# /sdlc:init writes, pinned to the same tag as sdlc_ref.
#
# Fires when a spec merges, next to spec-to-stories.
# 1. sdlc:init mode=headless reads the spec's Technology and architecture
#    decision and writes a proposal (.sdlc-output/init-stack.json) with the
#    spec line behind each value, or "not decided" when the spec still says
#    "Decision needed". Claude never picks between options.
# 2. init_project.py --stack validates it and applies it (deterministic).
# 3. Only if build.yaml or deploy.yaml changed: a stack PR (sdlc/stack-<slug>)
#    for the tech lead. Merging it lets the automatic Build start.
# Not decided: no PR; the run summary and the spec's Jira record say so.

on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: "Tag of chimera-technologies/sdlc-marketplace to use for skills and scripts (same as the uses: @ref)"
        type: string
        required: true
      sdlc_repo:
        description: "The plugin marketplace repo"
        type: string
        default: chimera-technologies/sdlc-marketplace
      app_id:
        description: "GitHub App (sdlc-bot) ID: vars.SDLC_APP_ID"
        type: string
        required: true
      base_branch:
        description: "The protected branch artifacts merge into"
        type: string
        default: main
      jira_base_url:
        description: "vars.JIRA_BASE_URL, empty = no Jira"
        type: string
        default: ""
      jira_user_email:
        description: "vars.JIRA_USER_EMAIL"
        type: string
        default: ""
      model:
        description: "Claude model for reading the decision"
        type: string
        default: claude-sonnet-5
      spec_file:
        description: "Re-run for one merged spec (specs/<slug>.md); empty = specs changed in this push"
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token (claude setup-token); or set ANTHROPIC_API_KEY"
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SDLC_APP_PRIVATE_KEY:
        description: "sdlc-bot GitHub App private key"
        required: true
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  PLUGIN_DIR: .sdlc-plugin/plugins/sdlc
  INIT: .sdlc-plugin/plugins/sdlc/skills/init/scripts/init_project.py
  VALIDATE_SPEC: .sdlc-plugin/plugins/sdlc/skills/write-spec/scripts/validate_spec.py
  MODEL: ${{ inputs.model }}
  JIRA_BASE_URL: ${{ inputs.jira_base_url }}
  JIRA_USER_EMAIL: ${{ inputs.jira_user_email }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.changed.outputs.files }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token (reads the PR list)
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List specs added or modified in this push
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_FILE: ${{ inputs.spec_file }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_FILE" ]; then
            [[ "$MANUAL_FILE" =~ ^specs/[a-z0-9-]+\.md$ ]] || { echo "::error::spec_file must look like specs/<slug>.md"; exit 1; }
            [ -f "$MANUAL_FILE" ] || { echo "::error::$MANUAL_FILE is not on the base branch"; exit 1; }
            echo "files=$(jq -cn --arg f "$MANUAL_FILE" '[$f]')" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$AFTER^"
          fi
          files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- 'specs/*.md' | jq -R . | jq -sc .)
          # Catch-up: while no stack is recorded (no test_command), also take merged
          # specs that never got a stack PR (any state): an upgrade, or a decision
          # that was only accepted later, still reaches Build without a manual re-run.
          tc=$(sed -n 's/^test_command:[[:space:]]*\([^#]*\).*/\1/p' .sdlc/build.yaml 2>/dev/null | head -n1 | sed 's/[[:space:]]*$//')
          if [ "$files" = "[]" ] && [ -z "$tc" ] && compgen -G 'specs/*.md' >/dev/null; then
            gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 500 --json headRefName -q '.[].headRefName' \
              > "$RUNNER_TEMP/branches.txt" 2>/dev/null || true
            for f in specs/*.md; do
              slug=$(basename "$f" .md)
              if ! grep -qxF "sdlc/stack-$slug" "$RUNNER_TEMP/branches.txt"; then
                echo "No stack recorded yet; catching up: $f"
                files=$(jq -c --arg f "$f" '. + [$f]' <<<"$files")
              fi
            done
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Specs: $files"

  stack:
    needs: detect
    if: needs.detect.outputs.files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1   # the stack is project-wide: one proposal at a time
      matrix:
        file: ${{ fromJSON(needs.detect.outputs.files) }}
    env:
      SPEC: ${{ matrix.file }}
      SDLC_HEADLESS: "1"
      SDLC_WRITE_ALLOW: ".sdlc-output/"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          persist-credentials: false

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin
          persist-credentials: false

      - name: Read the spec
        id: meta
        run: |
          set -euo pipefail
          python3 "$VALIDATE_SPEC" --json "$SPEC" > "$RUNNER_TEMP/spec.json"
          slug=$(jq -r .id "$RUNNER_TEMP/spec.json")
          [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::bad slug"; exit 1; }
          lead=$(jq -r '.tech_lead // ""' "$RUNNER_TEMP/spec.json")
          reviewer=${lead#@}; [[ "$reviewer" == */* ]] && reviewer=""   # teams are routed by CODEOWNERS
          {
            echo "slug=$slug"; echo "reviewer=$reviewer"
            echo "record_id=$(jq -r '.record_id // "none"' "$RUNNER_TEMP/spec.json")"
          } >> "$GITHUB_OUTPUT"
          mkdir -p .sdlc-output

      - name: Did the tech lead accept the spec?
        id: accepted
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LEAD: ${{ steps.meta.outputs.reviewer }}
        run: |
          set -euo pipefail
          # Merging (or approving) the spec PR is the tech lead's acceptance of its
          # recommended option. A team lead cannot be checked here: left undecided.
          if [ -n "$LEAD" ]; then
            for sha in $(gh api "repos/$GITHUB_REPOSITORY/commits?path=$SPEC&per_page=20" -q '.[].sha' 2>/dev/null || true); do
              for n in $(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" -q '.[] | select(.merged_at != null) | .number' 2>/dev/null || true); do
                by=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" -q '.merged_by.login // ""' 2>/dev/null || true)
                approvers=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n/reviews" -q '[.[] | select(.state == "APPROVED") | .user.login] | join(" ")' 2>/dev/null || true)
                if [ "$by" = "$LEAD" ] || grep -qw -- "$LEAD" <<<"$approvers"; then
                  echo "Accepted by @$LEAD in spec PR #$n"
                  { echo "by=@$LEAD"; echo "pr=$n"; } >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              done
            done
          fi
          echo "No tech lead acceptance found for $SPEC"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: AI budget check (stack)
        id: budget-stack
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: check
          stage: stack
          token: ${{ steps.app.outputs.token }}

      - name: Read the decision with init (headless)
        env:
          AI_BUDGET: ${{ steps.budget-stack.outputs.flag }}
          ACCEPTED_BY: ${{ steps.accepted.outputs.by }}
          ACCEPTED_PR: ${{ steps.accepted.outputs.pr }}
        run: |
          set -euo pipefail
          accepted=""
          if [ -n "$ACCEPTED_BY" ]; then accepted=" accepted_by=$ACCEPTED_BY accepted_pr=$ACCEPTED_PR"; fi
          read -ra ai_budget <<<"${AI_BUDGET:-}"   # --max-budget-usd <n> from the budget check
          claude -p "/sdlc:init mode=headless stack=$SPEC$accepted" \
            "${ai_budget[@]}" \
            --plugin-dir "$PLUGIN_DIR" \
            --model "$MODEL" \
            --max-turns 30 \
            --strict-mcp-config \
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(python3 *init_project.py*)" \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/stack-transcript.jsonl"
          tail -n1 "$RUNNER_TEMP/stack-transcript.jsonl" | jq -r '"turns: \(.num_turns)  cost: \(.total_cost_usd)  error: \(.is_error)"' || true
          # Only the deterministic step below may change .sdlc/.
          git checkout -- .sdlc/ 2>/dev/null || true
          [ -s .sdlc-output/init-stack.json ] || { echo "::error::no proposal written (.sdlc-output/init-stack.json)"; exit 1; }

      - name: Record AI spend (stack)
        if: always() && steps.budget-stack.outcome == 'success'
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: record
          stage: stack
          transcript: ${{ runner.temp }}/stack-transcript.jsonl
          token: ${{ steps.app.outputs.token }}

      - name: Validate and apply the proposal
        id: apply
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          set -euo pipefail
          p=.sdlc-output/init-stack.json
          jq -e 'type == "object"' "$p" >/dev/null || { echo "::error::$p is not a JSON object"; exit 1; }
          if [ "$(jq -r '.decided // false' "$p")" != "true" ]; then
            reason=$(jq -r '.reason // "the spec has no final decision"' "$p")
            echo "::notice::Stack not decided in $SPEC: $reason"
            echo "### Stack not decided yet"$'\n\n'"\`$SPEC\`: $reason"$'\n\n'"Builds wait. Decide it in the spec (tech lead), or record it with \`/sdlc:init stack=$SPEC\`." >> "$GITHUB_STEP_SUMMARY"
            { echo "status=undecided"; echo "reason<<SDLC_EOF"; echo "$reason"; echo "SDLC_EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$INIT" --stack "$p"
          if git diff --quiet -- .sdlc/build.yaml .sdlc/deploy.yaml; then
            echo "::notice::the stack in .sdlc/ already matches $SPEC; no PR"
            echo "status=unchanged" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "The stack and where it runs, read from the accepted spec \`$SPEC\` (Technology and architecture)."
            echo
            echo "**Merge to record it: the automatic Build starts with the first story.** Edit the values on this branch if anything is wrong; close it to keep the current ones."
            echo
            echo "| Setting | Value | From the spec |"
            echo "|---|---|---|"
            jq -r '
              def cell: tostring | gsub("\\|"; "\\|") | gsub("\n"; " ");
              . as $s | ($s.evidence // {}) as $e
              | ([ "toolchains","install_command","test_command","test_file_command","test_paths","code_paths","report_path","setup_command" ]
                 | map(select($s[.] != null and $s[.] != "" and $s[.] != [])) | map({k: ., v: $s[.], e: ($e[.] // "")}))
                + ([ ($s.deploy // {}) | to_entries[] | select(.value != "" and .value != "none") | {k: ("deploy." + .key), v: .value, e: ($e[.key] // $e["deploy." + .key] // "")} ])
              | .[] | "| `\(.k)` | `\(.v | if type == "array" then join(", ") else . end | cell)` | \(.e | cell) |"' "$p"
            echo
            echo '```diff'; git diff -- .sdlc/build.yaml .sdlc/deploy.yaml; echo '```'
            echo
            echo "### Review checklist"
            echo "- [ ] Toolchains, install and test commands are the ones the spec decided"
            echo "- [ ] Code and test paths cover where this project's code lives"
            echo "- [ ] Cloud and IaC match the spec (or stay none)"
          } > "$RUNNER_TEMP/pr-body.md"
          echo "status=changed" >> "$GITHUB_OUTPUT"

      - name: Upload transcript (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-transcript-${{ steps.meta.outputs.slug }}
          path: |
            ${{ runner.temp }}/stack-transcript.jsonl
            .sdlc-output/init-stack.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Open the stack PR
        id: open-pr
        if: steps.apply.outputs.status == 'changed'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: sdlc/stack-${{ steps.meta.outputs.slug }}
          base: ${{ inputs.base_branch }}
          add-paths: |
            .sdlc/build.yaml
            .sdlc/deploy.yaml
          commit-message: |
            sdlc: record the stack for ${{ steps.meta.outputs.slug }}

            From ${{ matrix.file }} @ ${{ github.sha }}
          title: "sdlc: record the stack for ${{ steps.meta.outputs.slug }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: stack

      - name: Request reviewers (never blocks)
        # Separate from opening the PR: a failed request must not fail the run (the PR is already open).
        if: always() && steps.open-pr.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.open-pr.outputs.pull-request-number }}
          REVIEWERS: ${{ steps.meta.outputs.reviewer }}
          TEAM_REVIEWERS: ''
        run: |
          set -uo pipefail
          args=()
          IFS=',' read -ra users <<<"${REVIEWERS:-}"
          for u in "${users[@]}"; do u=${u// /}; [ -n "$u" ] && args+=(-f "reviewers[]=$u"); done
          IFS=',' read -ra teams <<<"${TEAM_REVIEWERS:-}"
          for t in "${teams[@]}"; do t=${t// /}; [ -n "$t" ] && args+=(-f "team_reviewers[]=$t"); done
          [ "${#args[@]}" -gt 0 ] || { echo "No reviewers to request."; exit 0; }
          out=""
          for wait in 0 5 20; do
            sleep "$wait"
            if out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" "${args[@]}" 2>&1); then
              echo "Requested review on #$PR_NUMBER from ${REVIEWERS:-} ${TEAM_REVIEWERS:-}"; exit 0
            fi
          done
          echo "::warning title=Review request failed::Could not request review on #$PR_NUMBER from ${REVIEWERS:-} ${TEAM_REVIEWERS:-}: ${out:0:300}. The PR is open; CODEOWNERS still asks the code owners."

      - name: Tell the spec's Jira record (not decided)
        if: steps.apply.outputs.status == 'undecided' && steps.meta.outputs.record_id != 'none'
        continue-on-error: true   # Jira never blocks the loop
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          KEY: ${{ steps.meta.outputs.record_id }}
          REASON: ${{ steps.apply.outputs.reason }}
        run: |
          python3 "$PLUGIN_DIR/skills/build-story/scripts/jira_story.py" "$KEY" comment "The stack for $SPEC is not decided yet, so builds wait: $REASON. The tech lead decides it in the spec, or records it with /sdlc:init stack=$SPEC."
