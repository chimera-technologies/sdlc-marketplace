name: "SDLC revise on request"

# Reusable workflow of the sdlc plugin (workflow_call). A reviewer comments "/sdlc revise <request>" on an open intent, spec or plan PR; Claude makes that change on the PR's branch.
# Projects call it from the .github/workflows/sdlc-*.yml files that
# /sdlc:init writes, pinned to the same tag as sdlc_ref.
#
#   /sdlc revise <what to change>          intent/, spec/ or plan/ PRs
#   /sdlc revise design: <what to change>  spec PRs: the UI mockups only
#
# Only the repo's owners, members and collaborators can ask. The request is
# data for the skill, never instructions. The skill changes only the PR's
# artifact (and, for a spec, its mockups when the stories or screens change);
# the validators must pass before anything is pushed. The push re-runs the
# checks and the pre-screen; the bot replies with what changed. Merging is
# still the reviewer's decision.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner for every job: ubuntu-latest (GitHub-hosted) or a self-hosted label (vars.SDLC_RUNS_ON)"
        type: string
        default: ubuntu-latest
      sdlc_ref:
        description: "Tag of chimera-technologies/sdlc-marketplace to use for skills and scripts (same as the uses: @ref)"
        type: string
        required: true
      sdlc_repo:
        description: "The plugin marketplace repo"
        type: string
        default: chimera-technologies/sdlc-marketplace
      app_id:
        description: "GitHub App (sdlc-bot) ID: vars.SDLC_APP_ID"
        type: string
        required: true
      base_branch:
        description: "The protected branch artifacts merge into"
        type: string
        default: main
      jira_base_url:
        description: "vars.JIRA_BASE_URL (unused here; same inputs as the other callers)"
        type: string
        default: ""
      jira_user_email:
        description: "vars.JIRA_USER_EMAIL (unused here)"
        type: string
        default: ""
      model:
        description: "Claude model for the revision"
        type: string
        default: claude-opus-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token (claude setup-token); or set ANTHROPIC_API_KEY"
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SDLC_APP_PRIVATE_KEY:
        description: "sdlc-bot GitHub App private key"
        required: true
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  PLUGIN_DIR: .sdlc-plugin/plugins/sdlc
  VALIDATE_INTENT: .sdlc-plugin/plugins/sdlc/skills/write-intent/scripts/validate_intent.py
  VALIDATE_SPEC: .sdlc-plugin/plugins/sdlc/skills/write-spec/scripts/validate_spec.py
  VALIDATE_PLAN: .sdlc-plugin/plugins/sdlc/skills/build-story/scripts/validate_plan.py
  VALIDATE_DESIGN: .sdlc-plugin/plugins/sdlc/skills/design-ui/scripts/validate_design.py
  RENDER_MOCKUPS: .sdlc-plugin/plugins/sdlc/skills/design-ui/scripts/render_mockups.py
  PR: ${{ github.event.issue.number }}
  COMMENT_ID: ${{ github.event.comment.id }}

jobs:
  revise:
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/sdlc revise')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    concurrency:
      group: revise-${{ github.event.issue.number }}
      cancel-in-progress: false   # requests on one PR run one after another
    env:
      SDLC_HEADLESS: "1"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ inputs.model }}
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - name: Which PR and artifact
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
          info=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName,state,isCrossRepository \
                   -q '"\(.headRefName) \(.state) \(.isCrossRepository)"')
          read -r head state cross <<<"$info"
          kind=""; file=""
          case "$head" in
            intent/*) kind=intent; file="intent/${head#intent/}.md" ;;
            spec/*)   kind=spec;   file="specs/${head#spec/}.md" ;;
            plan/*)   kind=plan;   file="plans/${head#plan/}.md" ;;
          esac
          reason=""
          [ "$state" = "OPEN" ] || reason="the PR is not open"
          [ "$cross" = "false" ] || reason="the PR comes from a fork"
          [ -n "$kind" ] || reason="/sdlc revise works on intent, spec and plan PRs (this branch is $head)"
          if [ -n "$reason" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="Not revising: $reason." >/dev/null \
              || echo "::warning::could not reply on #$PR"
            echo "kind=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The request: everything after "/sdlc revise". "design:" asks for the mockups only.
          request=$(printf '%s' "$BODY" | sed '1s|^/sdlc revise[[:space:]]*||')
          design_only=false
          if printf '%s' "$request" | head -n1 | grep -qi '^design:'; then
            design_only=true; request=$(printf '%s' "$request" | sed '1s|^[Dd]esign:[[:space:]]*||')
          fi
          [ "$kind" = spec ] || design_only=false
          if [ -z "${request//[[:space:]]/}" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="Say what to change: \`/sdlc revise <request>\`." >/dev/null \
              || echo "::warning::could not reply on #$PR"
            echo "kind=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$request" > "$RUNNER_TEMP/request.md"
          { echo "kind=$kind"; echo "file=$file"; echo "head=$head"; echo "slug=$(basename "$file" .md)"
            echo "design_only=$design_only"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pr.outputs.kind != ''
        with:
          ref: ${{ steps.pr.outputs.head }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Check out the sdlc plugin (pinned)
        if: steps.pr.outputs.kind != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.kind != ''
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.pr.outputs.kind != ''
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p .sdlc-input .sdlc-output
          cp "$RUNNER_TEMP/request.md" .sdlc-input/revise.md

      - name: AI budget check (revise)
        id: budget-revise
        if: steps.pr.outputs.kind != ''
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: check
          stage: revise
          token: ${{ steps.app.outputs.token }}

      - name: Revise the artifact (headless)
        id: artifact
        if: steps.pr.outputs.kind != '' && steps.pr.outputs.design_only != 'true'
        env:
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"   # wait for workflow agents to finish; the job timeout is the limit
          AI_BUDGET: ${{ steps.budget-revise.outputs.flag }}
          KIND: ${{ steps.pr.outputs.kind }}
          FILE: ${{ steps.pr.outputs.file }}
        run: |
          set -euo pipefail
          case "$KIND" in
            intent) cmd="/sdlc:write-intent mode=revise file=$FILE request=.sdlc-input/revise.md"; tool="Bash(python3 *validate_intent.py*)" ;;
            spec)   cmd="/sdlc:write-spec mode=revise spec=$FILE request=.sdlc-input/revise.md"; tool="Bash(python3 *validate_spec.py*)" ;;
            plan)   cmd="/sdlc:build-story mode=revise plan=$FILE request=.sdlc-input/revise.md"; tool="Bash(python3 *validate_plan.py*)" ;;
          esac
          read -ra ai_budget <<<"${AI_BUDGET:-}"   # --max-budget-usd <n> from the budget check
          SDLC_WRITE_ALLOW="$FILE,.sdlc-output/revise-summary.md" \
          claude -p "$cmd" \
            "${ai_budget[@]}" \
            --plugin-dir "$PLUGIN_DIR" \
            --model "$MODEL" \
            --max-turns 60 \
            --strict-mcp-config \
            --allowedTools "Read,Glob,Grep,Write,Edit,$tool" \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/revise-artifact.jsonl"
          tail -n1 "$RUNNER_TEMP/revise-artifact.jsonl" | jq -r '"turns: \(.num_turns)  cost: \(.total_cost_usd)  error: \(.is_error)"' || true
          if [ -f .sdlc-output/revise-summary.md ]; then mv .sdlc-output/revise-summary.md "$RUNNER_TEMP/summary-artifact.md"; fi

      - name: Revise the mockups (spec PRs, when the stories or screens changed)
        id: design
        if: steps.pr.outputs.kind == 'spec'
        env:
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"   # wait for workflow agents to finish; the job timeout is the limit
          AI_BUDGET: ${{ steps.budget-revise.outputs.flag }}
          FILE: ${{ steps.pr.outputs.file }}
          SLUG: ${{ steps.pr.outputs.slug }}
          DESIGN_ONLY: ${{ steps.pr.outputs.design_only }}
        run: |
          set -euo pipefail
          m="designs/$SLUG/design.md"
          need=$DESIGN_ONLY
          if [ "$need" != true ] && [ -f "$m" ]; then
            grep -qx 'design: update' "$RUNNER_TEMP/summary-artifact.md" 2>/dev/null && need=true
            python3 "$VALIDATE_DESIGN" --no-images --owners .sdlc/owners.yaml "$m" >/dev/null 2>&1 || need=true
          fi
          if [ "$need" != true ]; then echo "The mockups still match the spec."; exit 0; fi
          read -ra ai_budget <<<"${AI_BUDGET:-}"
          SDLC_WRITE_ALLOW="designs/,.sdlc-output/revise-summary.md" \
          claude -p "/sdlc:design-ui mode=revise spec=$FILE request=.sdlc-input/revise.md" \
            "${ai_budget[@]}" \
            --plugin-dir "$PLUGIN_DIR" \
            --model "$MODEL" \
            --max-turns 60 \
            --strict-mcp-config \
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(python3 *validate_design.py*)" \
            --output-format stream-json --verbose \
            > "$RUNNER_TEMP/revise-design.jsonl"
          if [ -f .sdlc-output/revise-summary.md ]; then mv .sdlc-output/revise-summary.md "$RUNNER_TEMP/summary-design.md"; fi
          # Deterministic: headless Chrome, scripts and network blocked.
          python3 "$RENDER_MOCKUPS" "$m"
          echo "revised=true" >> "$GITHUB_OUTPUT"

      - name: Record AI spend (revise)
        if: always() && steps.budget-revise.outcome == 'success'
        uses: ./.sdlc-plugin/.github/actions/ai-budget
        with:
          mode: record
          stage: revise
          transcript: ${{ runner.temp }}/revise-*.jsonl
          token: ${{ steps.app.outputs.token }}

      - name: Validate, commit and reply
        if: always() && steps.pr.outputs.kind != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          KIND: ${{ steps.pr.outputs.kind }}
          FILE: ${{ steps.pr.outputs.file }}
          SLUG: ${{ steps.pr.outputs.slug }}
          HEAD: ${{ steps.pr.outputs.head }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -uo pipefail
          # Replies go through the REST API (as the review gate and pre-screen do), and a reply
          # that fails is a warning with GitHub's error: the revision itself is already pushed.
          reply() {
            local out
            if out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$1" 2>&1); then
              echo "Replied on #$PR."
            else
              echo "::warning title=Reply failed::Could not reply on #$PR: ${out:0:300}"
            fi
          }
          paths=("$FILE")
          if [ "$KIND" = spec ] && [ -d "designs/$SLUG" ]; then paths+=("designs/$SLUG"); fi
          git add -A -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "No change to $FILE."
            { printf 'No change made. '
              if [ -s "$RUNNER_TEMP/summary-artifact.md" ]; then cat "$RUNNER_TEMP/summary-artifact.md"; else echo "Nothing changed."; fi
            } > "$RUNNER_TEMP/reply.md"
            reply "$RUNNER_TEMP/reply.md"
            exit 0
          fi
          case "$KIND" in
            intent) check=(python3 "$VALIDATE_INTENT" --owners .sdlc/owners.yaml "$FILE") ;;
            spec)   check=(python3 "$VALIDATE_SPEC" --owners .sdlc/owners.yaml "$FILE") ;;
            plan)   check=(python3 "$VALIDATE_PLAN" --root . "$FILE") ;;
          esac
          echo "Validating $FILE..."
          if ! errors=$("${check[@]}" 2>&1); then
            echo "::error::$FILE does not pass validation; nothing pushed."
            printf 'The revision does not pass validation, so nothing was pushed:\n\n~~~\n%s\n~~~\n' "$errors" > "$RUNNER_TEMP/reply.md"
            reply "$RUNNER_TEMP/reply.md"
            exit 1
          fi
          if [ "$KIND" = spec ] && [ -f "designs/$SLUG/design.md" ]; then
            if ! errors=$(python3 "$VALIDATE_DESIGN" --owners .sdlc/owners.yaml "designs/$SLUG/design.md" 2>&1); then
              echo "::error::the revised mockups do not pass validation; nothing pushed."
              printf 'The revised mockups do not pass validation, so nothing was pushed:\n\n~~~\n%s\n~~~\n' "$errors" > "$RUNNER_TEMP/reply.md"
              reply "$RUNNER_TEMP/reply.md"
              exit 1
            fi
          fi
          uid=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${uid}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -q -m "revise: $(head -n1 "$RUNNER_TEMP/request.md" | cut -c1-60)" \
                      -m "Requested in a PR comment: $COMMENT_URL"
          if ! git push -q origin "HEAD:$HEAD"; then
            echo "::error::could not push the revision to $HEAD (the branch may have moved; ask again)."
            exit 1
          fi
          sha=$(git rev-parse --short HEAD)
          echo "Pushed $sha to $HEAD."
          {
            echo "Revised as asked in [this comment]($COMMENT_URL): \`$sha\`."
            echo
            for f in "$RUNNER_TEMP/summary-artifact.md" "$RUNNER_TEMP/summary-design.md"; do
              if [ -f "$f" ]; then grep -vx 'design: update' "$f"; fi
            done
            echo
            echo '~~~'; git show --stat --format= HEAD; echo '~~~'
            echo
            echo "The checks and the pre-screen run again on this push. Review the change before you merge."
          } > "$RUNNER_TEMP/reply.md"
          reply "$RUNNER_TEMP/reply.md"
