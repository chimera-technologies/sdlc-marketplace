name: "SDLC Test: main"

# Reusable workflow of the sdlc plugin (workflow_call). After every merge to the base branch: run the project's tests.
# Projects call it from the .github/workflows/sdlc-*.yml files that
# /sdlc:init writes, pinned to the same tag as sdlc_ref.
#
# End-to-end tests on main after every merge. Pull requests run the same
# suite in pr.yml, after the PR review gate (Build -> PR review -> Test).
# Trunk-based: a red base branch stops the line. The trunk job opens a
# "main is red" issue (label main-red) when the tests fail, and closes it when
# they pass again; the generated caller holds Build and Deploy until then.
# After a story PR merges, the report job writes its test report
# (test-reports/<plan-id>/: every test case and its status in each testing
# flow) and opens it as a test-report PR.

on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: "Tag of chimera-technologies/sdlc-marketplace to use for skills and scripts (same as the uses: @ref)"
        type: string
        required: true
      sdlc_repo:
        description: "The plugin marketplace repo"
        type: string
        default: chimera-technologies/sdlc-marketplace
      app_id:
        description: "GitHub App (sdlc-bot) ID: vars.SDLC_APP_ID"
        type: string
        required: true
      base_branch:
        description: "The protected branch artifacts merge into"
        type: string
        default: main
      jira_base_url:
        description: "vars.JIRA_BASE_URL, empty = no Jira"
        type: string
        default: ""
      jira_user_email:
        description: "vars.JIRA_USER_EMAIL"
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude subscription token (claude setup-token); or set ANTHROPIC_API_KEY"
        required: false
      ANTHROPIC_API_KEY:
        required: false
      SDLC_APP_PRIVATE_KEY:
        description: "sdlc-bot GitHub App private key"
        required: true
      JIRA_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - uses: actions/checkout@v4

      - name: Check out the sdlc plugin (pinned)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: Set up the project's stack (.sdlc/build.yaml)
        id: stack
        uses: ./.sdlc-plugin/.github/actions/setup-stack
        # No require-tests: main has no stack until the first spec's decision
        # is recorded, and no code until the first story merges; neither
        # must turn main red.
        with:
          skip-without-code: "true"

      - name: Nothing to test yet
        if: steps.stack.outputs.test_command == ''
        run: echo "::notice::Tests skipped. No test_command in .sdlc/build.yaml yet, or none of its code_paths exist (the first story creates them)."

      - name: Run the project's static checks (check_command)
        if: steps.stack.outputs.check_command != '' && steps.stack.outputs.test_command != ''
        env:
          CMD: ${{ steps.stack.outputs.check_command }}
        run: bash -euo pipefail -c "$CMD"

      - name: Run the project's tests (test_command)
        if: steps.stack.outputs.test_command != ''
        env:
          CMD: ${{ steps.stack.outputs.test_command }}
        run: bash -euo pipefail -c "$CMD"

      - name: Upload test report
        if: always() && steps.stack.outputs.report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}-${{ github.job }}
          path: ${{ steps.stack.outputs.report_path }}
          if-no-files-found: ignore
          retention-days: 30

  trunk:
    needs: e2e
    if: always() && (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - name: Open or close the "main is red" issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RESULT: ${{ needs.e2e.result }}
          BASE: ${{ inputs.base_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="$BASE is red: the tests fail on $BASE"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label main-red --state open --json number -q '.[0].number // empty' 2>/dev/null || true)
          short=${GITHUB_SHA::7}
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[0] | "#\(.number) \(.title)"' 2>/dev/null || true)
          if [ "$RESULT" = "failure" ]; then
            body="The tests failed on \`$BASE\` at \`$short\`${pr:+ (from $pr)}: $RUN_URL

          Trunk-based: fixing $BASE comes first. Until the tests pass again, automatic Build starts no new plan or story and nothing deploys. Fix forward with a small PR, or revert the change that broke it."
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still red at \`$short\`${pr:+ (from $pr)}: $RUN_URL"
            else
              gh label create main-red -R "$GITHUB_REPOSITORY" --color B60205 --description "The tests fail on the base branch" 2>/dev/null || true
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label main-red --body "$body"
            fi
            echo "::error::$BASE is red at $short; Build and Deploy are held until it is fixed."
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Green again at \`$short\`${pr:+ (from $pr)}: $RUN_URL. Build and Deploy carry on."
          fi

  report:
    needs: e2e
    # Also when the tests failed: the report says so.
    if: always() && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read         # the test jobs' logs
      checks: read          # the story PR's checks
      issues: read          # the review gate comment
      pull-requests: read   # the plan and story PRs
    env:
      GH_TOKEN: ${{ github.token }}
      PLUGIN_DIR: .sdlc-plugin/plugins/sdlc
    steps:
      - uses: actions/checkout@v4

      - name: Find the merged story PR
        id: find
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                 -q '([.[] | select(.merged_at != null and (.head.ref | startswith("story/")))][0] // empty) | "\(.number) \(.head.ref)"' \
                 2>/dev/null || true)
          if [ -z "$pr" ]; then
            echo "Not a story PR merge: no test report."; echo "story=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          read -r number head <<<"$pr"
          # The plan names its branch (story/<jira-key>-<name>, or story/<spec-slug>-s<n> without Jira).
          plan=$(grep -lx "branch: $head" plans/*.md 2>/dev/null | head -n1 || true)
          if [ -z "$plan" ] && [[ "$head" =~ ^story/([a-z][a-z0-9]*-[0-9]+)(-|$) ]]; then
            key=$(tr '[:lower:]' '[:upper:]' <<<"${BASH_REMATCH[1]}")   # older plans: by Jira key
            plan=$(grep -lx "jira: $key" plans/*.md 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$plan" ]; then
            echo "::notice::story PR #$number ($head) has no plan in plans/: no test report."
            echo "story=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "story=true"; echo "number=$number"; echo "plan=$plan"; echo "id=$(basename "$plan" .md)"; } >> "$GITHUB_OUTPUT"
          echo "Story PR #$number, plan $plan"

      - name: Collect the story's test evidence
        id: evidence
        if: steps.find.outputs.story == 'true'
        env:
          PR: ${{ steps.find.outputs.number }}
          ID: ${{ steps.find.outputs.id }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/report"; mkdir -p "$d"
          logs() { curl -sSfL -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$1/logs" > "$2" || rm -f "$2"; }
          gh pr view "$PR" --json number,title,url,body,comments,headRefName,mergedAt,mergeCommit > "$d/story-pr.json"
          # gh pr checks exits non-zero when a check failed or is pending; its JSON is still complete.
          gh pr checks "$PR" --json name,state,link > "$d/checks.json" 2>/dev/null || true
          link=$(gh pr checks "$PR" --json name,link -q '[.[] | select(.name | test("(^|/ )e2e$")) | .link][0] // ""' 2>/dev/null || true)
          plan_pr=$(gh pr list --state merged --head "plan/$ID" --json number -q '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$plan_pr" ]; then gh pr view "$plan_pr" --json number,url,body,mergedAt > "$d/plan-pr.json"; fi
          if [[ "$link" =~ /job/([0-9]+) ]]; then logs "${BASH_REMATCH[1]}" "$d/pr-tests.log"; fi
          main=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                   -q '([.jobs[] | select(.name | test("(^|/ )e2e$"))][0] // empty) | "\(.id) \(.html_url)"' 2>/dev/null || true)
          read -r main_job main_url <<<"${main:-}" || true
          if [ -n "${main_job:-}" ]; then logs "$main_job" "$d/main-tests.log"; fi
          echo "main_url=${main_url:-}" >> "$GITHUB_OUTPUT"

      - name: Scope the App token to this repo and the plugin repo
        id: app-repos
        if: steps.find.outputs.story == 'true'
        env:
          SDLC_REPO: ${{ inputs.sdlc_repo }}
        run: echo "names=${GITHUB_REPOSITORY#*/},${SDLC_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived GitHub App token
        id: app
        if: steps.find.outputs.story == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app-repos.outputs.names }}

      - name: Check out the sdlc plugin (pinned)
        if: steps.find.outputs.story == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdlc_repo }}
          ref: ${{ inputs.sdlc_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .sdlc-plugin

      - name: Write the test report
        id: write
        if: steps.find.outputs.story == 'true'
        env:
          PLAN: ${{ steps.find.outputs.plan }}
          PR: ${{ steps.find.outputs.number }}
          MAIN_RESULT: ${{ needs.e2e.result }}
          MAIN_URL: ${{ steps.evidence.outputs.main_url }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/report"
          args=()
          for pair in --story-pr=story-pr.json --story-checks=checks.json --plan-pr=plan-pr.json \
                      --pr-log=pr-tests.log --main-log=main-tests.log; do
            if [ -s "$d/${pair#*=}" ]; then args+=("${pair%%=*}" "$d/${pair#*=}"); fi
          done
          folder=$(python3 "$PLUGIN_DIR/skills/build-story/scripts/test_report.py" --plan "$PLAN" "${args[@]}" \
                     --main-result "$MAIN_RESULT" --main-url "$MAIN_URL")
          rm -rf .sdlc-plugin
          field() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$folder/summary.json" "$1"; }
          story=$(field story); title=$(field title); result=$(field result); tests=$(field tests)
          {
            echo "Test report for **$story: $title**, written after story PR #$PR merged: \`$folder/\`."
            echo
            echo "Result: **$(tr '[:lower:]' '[:upper:]' <<<"$result")**, $tests test cases. See \`$folder/README.md\` for each testing flow and \`$folder/test-cases.md\` for every test."
            echo
            echo "Merge to keep it in the repo; it changes nothing else."
          } > "$RUNNER_TEMP/report-body.md"
          { echo "folder=$folder"; echo "title=$story $title"; } >> "$GITHUB_OUTPUT"

      - name: Open the test-report PR
        if: steps.find.outputs.story == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: test-report/${{ steps.find.outputs.id }}
          base: ${{ inputs.base_branch }}
          add-paths: test-reports/
          commit-message: |
            test-report: ${{ steps.write.outputs.title }}

            Written after story PR #${{ steps.find.outputs.number }} merged (${{ github.sha }}).
          title: "test-report: ${{ steps.write.outputs.title }}"
          body-path: ${{ runner.temp }}/report-body.md
          labels: test-report
